name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7 # v3.9.0
        with:
          ocaml-compiler: "5.3"
      - run: opam install . --deps-only --with-test -y
      - run: opam exec -- dune build
      - run: opam exec -- dune test   # expect tests + 4,000 random order streams against the reference model
      - run: opam exec -- dune exec --release bin/bench.exe -- 200000
